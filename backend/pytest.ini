[pytest]
# Put the backend root on sys.path so `import app...` works when pytest is run
# as a bare `pytest` from this directory - without this, tests only pass with
# PYTHONPATH=. set by hand.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
