# Render Blueprint - provisions the API and its Postgres in one go.
#   Render dashboard -> New -> Blueprint -> pick this repo.
#
# The frontend stays on Vercel: Next.js needs NEXT_PUBLIC_* inlined at build
# time, and Render's free web service sleeps, which a static frontend shouldn't.
databases:
  - name: signal-clone-db
    databaseName: signal
    user: signal
    plan: free

services:
  - type: web
    name: signal-clone-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render injects the connection string as postgresql://. The validator in
      # app/core/config.py pins asyncpg onto it, so this needs no editing.
      - key: DATABASE_URL
        fromDatabase:
          name: signal-clone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      # Free instances get no persistent disk, so attachments live on ephemeral
      # storage and are lost on restart. Message history survives in Postgres.
      - key: MEDIA_ROOT
        value: /tmp/media
      # Set to the Vercel URL after the frontend deploys. *.vercel.app is
      # already allowed by regex in app/main.py, so this is belt-and-braces.
      - key: CORS_ORIGINS
        sync: false
